name: Native assistant check
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      runner:
        description: Windows image for isolated native checks
        type: choice
        options: [windows-2022, windows-2025]
        default: windows-2022
permissions:
  contents: read
jobs:
  native:
    runs-on: ${{ inputs.runner || 'windows-2022' }}
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Build native assistant
        shell: pwsh
        run: |
          cmake -S launcher -B build-native -G Ninja -DCMAKE_BUILD_TYPE=Release
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cmake --build build-native
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          ctest --test-dir build-native --output-on-failure
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Compare isolated idle assistants
        shell: pwsh
        run: ./tests/measure-assistant.ps1 -NativeExe ./build-native/obs-quick-record-native.exe -Seconds 15
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-assistant-check
          path: |
            build-native/obs-quick-record-native.exe
            build-native/Testing/Temporary/LastTest.log
            build-benchmark/*.json
            build-benchmark/*.stderr.txt
          retention-days: 7
