name: Windows build
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Cache pinned SDK
        uses: actions/cache@v4
        with:
          path: .deps
          key: ${{ runner.os }}-obs32-x64-${{ hashFiles('tools/prepare-sdk.ps1') }}
      - name: Prepare pinned OBS 32.2.2 SDK
        shell: pwsh
        run: ./tools/prepare-sdk.ps1
      - name: Configure
        shell: pwsh
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER=cl "-DOBS_SOURCE_DIR=$pwd/.deps/obs-studio" "-DOBS_SDK_DIR=$pwd/.deps/sdk" "-DCMAKE_PREFIX_PATH=$pwd/.deps/qt"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Build and check
        shell: pwsh
        run: |
          cmake --build build
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $env:PATH = "$pwd\.deps\runtime\bin\64bit;$env:PATH"
          $env:QT_PLUGIN_PATH = "$pwd\.deps\qt\plugins"
          ctest --test-dir build --output-on-failure
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Upload test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: settings-ui-check
          path: |
            build/hotkey-check.exe
            build/capture-target.exe
            build/acceptance-driver.dll
            build/Testing/Temporary/LastTest.log
            .deps/qt/plugins/platforms/qminimal.dll
          include-hidden-files: true
          retention-days: 7
      - name: Package
        shell: pwsh
        run: |
          cmake --install build --prefix stage
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Compress-Archive stage/obs-quick-record obs-quick-record-windows-x64.zip
          ./tests/package-check.ps1 -Archive obs-quick-record-windows-x64.zip -BuildDirectory build
      - uses: actions/upload-artifact@v4
        with:
          name: obs-quick-record-windows-x64
          path: obs-quick-record-windows-x64.zip
